<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
  <tr>
    <td align="center" bgcolor="{{ c.primary }}" style="border-radius:8px;">
      <a href="{{ href }}" target="_blank" style="display:inline-block;padding:14px 28px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:{{ c.on_primary }};text-decoration:none;border-radius:8px;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="margin:0 0 8px 0;font-size:14px;line-height:20px;color:{{ c.muted }};">If the button doesn't work, copy and paste this link into your browser:</p>
<p style="margin:0 0 16px 0;font-size:14px;line-height:20px;word-break:break-all;"><a href="{{ href }}" style="color:{{ c.primary }};">{{ href }}</a></p>
