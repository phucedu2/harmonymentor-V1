[pytest]
testpaths = tests
pythonpath = .
markers =
    postgres: cần TEST_DATABASE_URL trỏ tới PostgreSQL thật (ví dụ test đồng thời HM-010)
    top_up: bật lượt gọi bù câu hỏi của AI soạn bài (mặc định tắt trong test, xem tests/conftest.py)
    live: gọi Gemini thật; cần RUN_LIVE=1, AI_ENABLED=1 và GEMINI_API_KEY. CI loại nhóm này
