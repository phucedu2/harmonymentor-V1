# /api/ chuyển sang dịch vụ api CÙNG ORIGIN, để cookie refresh (ADR-004) đi kèm mà không cần CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ghi đè (không nối thêm) để client không tự chèn IP giả vào X-Forwarded-For,
        # vì khóa đăng nhập đếm theo IP (TRUST_PROXY=true ở dịch vụ api).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Giai đoạn E stream câu trả lời Tutor (SSE): không gom đệm.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # File có hash trong tên: cache lâu.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn khác (ví dụ /app/ho-so khi tải lại trang) trả index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
