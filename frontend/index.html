<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmony Mentor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0C231F" />
    <meta name="description" content="Học nhạc lý bằng cách chơi nó: học, luyện tập có chẩn đoán, ôn tập và sáng tác." />
    <!-- FE-014: đặt theme trước khi vẽ để không nháy sáng khi người dùng đã chọn tối. -->
    <script>try{if(localStorage.getItem("hm-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
    <!-- Phương án nhận diện (src/theme/brands.css): VITE_BRAND khi build (mặc định san-khau, nhóm chọn 17/11/2026), hoặc ?brand=dong-gi|san-khau|giay-nhac để đổi trên máy này. -->
    <script>try{var q=new URLSearchParams(location.search).get("brand");if(q==="dong-gi"||q==="san-khau"||q==="giay-nhac")localStorage.setItem("hm-brand",q);var b=localStorage.getItem("hm-brand")||"%VITE_BRAND%";if(b==="san-khau"||b==="giay-nhac")document.documentElement.dataset.brand=b;if(b==="san-khau"){document.querySelector('link[rel=icon][type="image/svg+xml"]').href="/favicon-san-khau.svg";document.querySelector("meta[name=theme-color]").content="#17142B";document.querySelector("link[rel=apple-touch-icon]").href="/apple-touch-icon-san-khau.png";document.querySelector('link[rel=icon][sizes="48x48"]').href="/favicon-san-khau.ico"}}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
