# CI của HarmonyMentor AI (PR-2). Ba job chạy song song; một job đỏ là cả lượt đỏ.
# Không dùng secret nào: CSDL là container tạm do GitHub tạo cho mỗi lượt, xong là xóa.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Đẩy commit mới lên cùng PR thì hủy lượt cũ để đỡ tốn phút chạy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Giống backend/Dockerfile và frontend/Dockerfile.
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend-sqlite:
    name: Backend (SQLite, toàn bộ test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # requirements.txt ghi ">=", nên in bản thật đã cài để truy vết khi CI đỏ vì thư viện ra bản mới.
      - name: Phiên bản thư viện đã cài
        run: pip freeze

      - name: Kiểm tra cú pháp Python
        run: python -m compileall -q app tests migrations ../scripts

      # Nhóm postgres chạy ở job riêng; ở đây không đặt TEST_DATABASE_URL nên phải loại ra, nếu không sẽ bị skip.
      - name: Chạy pytest
        run: pytest -q -m "not postgres" --junitxml=../ket-qua-sqlite.xml

      # Mức tối thiểu = số test đạt sau PR-3 (27/10/2026): 281 cũ + 38 test phiên bản câu hỏi; ai xóa test thì CI đỏ.
      - name: Kiểm số test (0 skip, ít nhất 326 đạt)
        if: ${{ !cancelled() }}
        run: python ../scripts/ci/kiem_junit.py ../ket-qua-sqlite.xml --min-passed 326 --title "Backend SQLite"

      - name: Lưu kết quả JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-backend-sqlite
          path: ket-qua-sqlite.xml
          if-no-files-found: warn

  backend-postgres:
    name: Backend (PostgreSQL 16 + pgvector, Alembic, HM-010)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hm_ci
          # Mật khẩu chỉ dùng cho container tạm trong CI, không phải khóa thật của môi trường nào.
          POSTGRES_PASSWORD: ci_only_not_secret
          POSTGRES_DB: harmony_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hm_ci -d harmony_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: hm_ci
      PGPASSWORD: ci_only_not_secret
      # Hai CSDL khác nhau trên cùng máy chủ tạm: migration chạy ở harmony_ci_migrate (vai trò "CSDL của app"),
      # test HM-010 chạy ở harmony_test. Như vậy lớp bảo vệ của PR-1 (tên kết thúc _test, khác DATABASE_URL)
      # được kiểm thật chứ không bị lách.
      DATABASE_URL: postgresql+psycopg://hm_ci:ci_only_not_secret@127.0.0.1:5432/harmony_ci_migrate
      TEST_DATABASE_URL: postgresql+psycopg://hm_ci:ci_only_not_secret@127.0.0.1:5432/harmony_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tạo CSDL tạm cho migration
        run: |
          psql -d harmony_test -v ON_ERROR_STOP=1 -c "SELECT version();"
          psql -d harmony_test -v ON_ERROR_STOP=1 -c "CREATE DATABASE harmony_ci_migrate;"

      - name: alembic upgrade head
        run: alembic -c alembic.ini upgrade head

      # check: model SQLAlchemy và migration phải khớp; lệch là đỏ.
      - name: alembic check
        run: alembic -c alembic.ini check

      - name: Xác nhận migration đã áp dụng (phiên bản + pgvector)
        run: |
          psql -d harmony_ci_migrate -v ON_ERROR_STOP=1 -c "SELECT version_num FROM alembic_version;"
          test "$(psql -d harmony_ci_migrate -tAc "SELECT count(*) FROM pg_extension WHERE extname = 'vector'")" = "1"

      # Nhóm postgres: 9 test đồng thời HM-010 + 12 test migration PR-3 trên dữ liệu kế thừa và trigger chặn sửa phiên bản.
      - name: Chạy test PostgreSQL (HM-010, migration PR-3)
        run: pytest -m postgres -v --junitxml=../ket-qua-postgres.xml

      # pytest vẫn trả mã 0 khi các test này bị skip, nên phải đếm riêng.
      - name: Kiểm số test (0 skip, ít nhất 21 đạt)
        if: ${{ !cancelled() }}
        run: python ../scripts/ci/kiem_junit.py ../ket-qua-postgres.xml --min-passed 21 --title "PostgreSQL HM-010 + PR-3"

      # Test tự xóa schema hm_pgtest_* của mình; còn sót là lớp dọn dẹp của PR-1 hỏng.
      - name: Không còn schema test sót lại
        if: ${{ !cancelled() }}
        run: test "$(psql -d harmony_test -tAc "SELECT count(*) FROM information_schema.schemata WHERE schema_name LIKE 'hm_pgtest_%'")" = "0"

      - name: Lưu kết quả JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-backend-postgres
          path: ket-qua-postgres.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (npm ci + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      # build = tsc -b (kiểm kiểu TypeScript) + vite build; lỗi nào cũng làm bước này đỏ.
      - name: npm run build
        run: npm run build
